version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - AWS_REGION=$AWS_DEFAULT_REGION
      - ECR_REGISTRY=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY

  build:
    commands:
      - echo Building backend Docker image...
      - docker build -t $ECR_REGISTRY/java-app-backend:latest ./backend
      - echo Building frontend Docker image...
      - docker build -t $ECR_REGISTRY/java-app-frontend:latest ./frontend

  post_build:
    commands:
      - echo Pushing backend image...
      - docker push $ECR_REGISTRY/java-app-backend:latest
      - echo Pushing frontend image...
      - docker push $ECR_REGISTRY/java-app-frontend:latest
      - echo Build completed successfully.

artifacts:
  files:
    - appspec.yml
    - docker-compose.yml
    - scripts/**/*
